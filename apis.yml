name: Nobell Foods
description: >-
  Nobell Foods is a molecular-farming food-technology company founded by Magi
  Richani that produces animal-free cheese from plant-grown casein. The company
  engineered soybean plants to grow the same dairy caseins found in animal milk,
  working with independent Midwest farmers to raise the crop from seed to flower,
  then converting the plant-derived proteins into cheese that melts, stretches,
  and tastes like conventional dairy. Backed by DCVC, Y Combinator, Andreessen
  Horowitz, and investors including Bill Gates and Robert Downey Jr., Nobell
  raised a $75M Series B and has since rebranded to Alpine Bio, with Nobell Foods
  continuing as the animal-free cheese brand and product unit. It is a
  consumer-packaged-goods and biotech company with no public API or developer
  program; this profile was added to the API Evangelist network as a portfolio
  lead and enriched with verified public identity only.
